<style>
#override-board-choices .ov-board-stage { width:100%; max-width:420px; margin-inline:auto; }
#override-board-choices canvas { display:block; width:100%; height:auto; aspect-ratio:1; }
</style>
<script>
(function () {
  const root = document.getElementById('override-board-choices');
  const config = JSON.parse(root.querySelector('#override-board-assets').textContent);
  const images = {};
  const rows = ['..ooooo..','.ooooooo.','ooooooooo','ooooooooo','ooooooooo','ooooooooo','ooooooooo','.ooooooo.','..ooooo..'];
  const overrides = new Set([20,40,60]);
  const specials = {24:'lineH',56:'pulseCore',67:'patchBotAll'};
  const types = ['gear','core','bolt','plate'];
  const layout = [];
  let seed = 4016;
  function next() {seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed;}
  for (let y=0;y<9;y++) for (let x=0;x<9;x++) {
    const i=y*9+x;
    if (rows[y][x]==='.') { layout.push(null); continue; }
    const choices=types.filter(t => !(x>1 && layout[i-1]===t && layout[i-2]===t) && !(y>1 && layout[i-9]===t && layout[i-18]===t));
    layout.push(choices[next()%choices.length]);
  }
  function active(x,y) { return x>=0 && x<9 && y>=0 && y<9 && rows[y][x]!=='.'; }
  function icon(ctx, img, x, y, extent) {
    const scale=Math.min(extent/img.width,extent/img.height);
    const w=img.width*scale,h=img.height*scale;
    ctx.drawImage(img,x+(105-w)/2,y+(105-h)/2,w,h);
  }
  function draw(canvas) {
    const ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,1005,1005);
    const bg=images.background;
    const scale=Math.max(1005/bg.width,1005/bg.height);
    ctx.drawImage(bg,(1005-bg.width*scale)/2,(1005-bg.height*scale)/2,bg.width*scale,bg.height*scale);
    ctx.fillStyle='rgba(22,16,52,.20)';ctx.fillRect(0,0,1005,1005);
    const inset=30,cell=105;
    for (let y=0;y<9;y++) for (let x=0;x<9;x++) {
      const i=y*9+x;
      if (!layout[i]) continue;
      const px=inset+x*cell,py=inset+y*cell;
      ctx.fillStyle='#a9a7d9';ctx.fillRect(px,py,cell,cell);
      ctx.strokeStyle='rgba(229,224,250,.28)';ctx.lineWidth=2;ctx.strokeRect(px+1,py+1,cell-2,cell-2);
    }
    ctx.strokeStyle='#e6a63a';ctx.lineWidth=6;ctx.lineJoin='round';
    ctx.beginPath();
    for (let y=0;y<9;y++) for (let x=0;x<9;x++) {
      if (!active(x,y)) continue;
      const px=inset+x*cell,py=inset+y*cell;
      if (!active(x,y-1)) {ctx.moveTo(px,py);ctx.lineTo(px+cell,py);}
      if (!active(x,y+1)) {ctx.moveTo(px,py+cell);ctx.lineTo(px+cell,py+cell);}
      if (!active(x-1,y)) {ctx.moveTo(px,py);ctx.lineTo(px,py+cell);}
      if (!active(x+1,y)) {ctx.moveTo(px+cell,py);ctx.lineTo(px+cell,py+cell);}
    }
    ctx.stroke();
    for (let y=0;y<9;y++) for (let x=0;x<9;x++) {
      const i=y*9+x;
      if (!layout[i]) continue;
      const type=overrides.has(i)?canvas.dataset.orb:(specials[i]||layout[i]);
      icon(ctx,images[type],inset+x*cell,inset+y*cell,95*1.05*.89);
    }
    canvas.dataset.rendered='true';
  }
  Promise.all(Object.entries(config.assets).map(([key,src])=>new Promise((resolve,reject)=>{
    const img=new Image();img.onload=()=>{images[key]=img;resolve();};img.onerror=()=>reject(new Error(key));img.src=src;
  }))).then(()=>root.querySelectorAll('canvas[data-orb]').forEach(draw)).catch(()=>{
    const error=document.createElement('p');error.setAttribute('role','alert');error.textContent='Görseller yüklenemedi.';root.appendChild(error);
  });
})();
</script>
